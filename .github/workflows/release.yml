name: Release

on:
  release:
    types:  [ created ]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publishMavenCentral:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    environment:
      name: mavenCentral

    steps:
      - name: Set environment for version
        uses: hfhbd/actions/setup-version@main
        id: version
      - uses: actions/checkout@v5
      - uses: gradle/actions/setup-gradle@v5

      - name: Release maven artifacts
        run: ./gradlew publishToMavenCentral -Pversion=${{ steps.version.outputs.version }}
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}

  publishGitHubPackages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    environment:
      name: GPR

    steps:
      - name: Set environment for version
        uses: hfhbd/actions/setup-version@main
        id: version
      - uses: actions/checkout@v5
      - uses: gradle/actions/setup-gradle@v5

      - name: Release maven artifacts
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository -Pversion=${{ steps.version.outputs.version }}
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ github.token }}

  buildDocs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: gradle/actions/setup-gradle@v5

      - name: Create docs
        run: ./gradlew :dokkaGenerate
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/dokka/html
      - name: Deploy Documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
